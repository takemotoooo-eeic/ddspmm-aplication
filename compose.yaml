services:
  nginx:
    container_name: ddspmm-application-nginx
    build:
      context: ./nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/conf.d:/etc/nginx/conf.d
    depends_on:
      - web
      - api

  api:
    build:
      context: ./backend
      dockerfile: ./Dockerfile
    working_dir: /app
    container_name: ddspmm-application-api
    ports:
      - "8888:8888"
    volumes:
      - ./backend:/app
      - ${MELODYFLOW_MODEL_HOST:-./backend/api/models/melodyflow_assets/melodyflow-t24-30secs}:/app/api/models/melodyflow_assets/melodyflow-t24-30secs:ro
      - ${HF_CACHE_HOST:-./backend/.cache/huggingface}:/root/.cache/huggingface
    environment:
      - PYTHONPATH=/app
      - TF_CPP_MIN_LOG_LEVEL=2
      - TF_ENABLE_ONEDNN_OPTS=0
      - HF_HOME=/root/.cache/huggingface
      - HUGGINGFACE_HUB_CACHE=/root/.cache/huggingface/hub
      - TRANSFORMERS_CACHE=/root/.cache/huggingface/hub
    command: uvicorn api.app:app --host 0.0.0.0 --port 8888 --reload
    deploy:
      resources:
        reservations:
          devices:
            - capabilities: [gpu]

  web:
    container_name: ddspmm-application-web
    build:
      context: .
      dockerfile: ./frontend/Dockerfile
      target: ${TARGET:-dev}
    working_dir: /app
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      - ./backend/api/controllers/backend_api/openapi/openapi.yml:/opt/backend_api_openapi.yml
    env_file:
      - ./frontend/.env
    environment:
      - API_PROXY_TARGET=http://api:8888

